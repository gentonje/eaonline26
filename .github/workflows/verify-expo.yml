name: Expo web build and TypeScript check

on:
  pull_request:
    branches: [main, feature/product-comparison]
  push:
    branches: [feature/product-comparison, feature/marketplace-taxonomy-foundation]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Export Expo web build
        run: npm run build:web
